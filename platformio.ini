[platformio]
default_envs = esp32c6_zigbee_ed

[env:esp32c6_zigbee_ed]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = zigbee.csv
lib_deps =
	adafruit/Adafruit BME280 Library @ ^2.1.2
	adafruit/Adafruit Unified Sensor @ ^1.1.4
build_flags =
	-I include
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Wl,-wrap,esp_ieee802154_receive_done
	-Wl,-wrap,esp_ieee802154_transmit_done
	-DZIGBEE_MODE_ED
	-DMONITOR_RESET_PIN=GPIO_NUM_2
	-DMONITOR_RESET_ACTIVE_HIGH=0
	-DMONITOR_BATTERY_PIN=A0
	-DMONITOR_BATTERY_DIVIDER_RATIO=2.0f
	-DMONITOR_BME280_SDA_PIN=D4
	-DMONITOR_BME280_SCL_PIN=D5
	-DMONITOR_MEASURE_INTERVAL_S=30
	-DMONITOR_ZIGBEE_REJOIN_TIMEOUT_MS=15000UL
build_src_filter =
	-<*>
	+<Main.cpp>
