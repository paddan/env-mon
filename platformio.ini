[platformio]
default_envs = esp32c3_supermini

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/tty.usbmodem101
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps = 
	adafruit/Adafruit BME280 Library @ ^2.1.2
	adafruit/Adafruit Unified Sensor @ ^1.1.4
	https://github.com/tzapu/WiFiManager.git
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.17.3
	thijse/ArduinoLog@^1.0.3
build_flags =
	-I include
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DMONITOR_RESET_PIN=GPIO_NUM_2
	-DMONITOR_RESET_ACTIVE_HIGH=0
	-DMONITOR_BATTERY_PIN=GPIO_NUM_4
	-DMONITOR_BME280_SDA_PIN=8
	-DMONITOR_BME280_SCL_PIN=9
	-DMONITOR_BATTERY_ATTENUATION=ADC_ATTEN_DB_12

[env:native]
platform = native
test_build_src = no
build_src_filter = -<*>
