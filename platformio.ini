; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:firebeetle32]
platform = espressif32
board = firebeetle32
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit BME280 Library @ ^2.1.2
	adafruit/Adafruit Unified Sensor @ ^1.1.4
	https://github.com/tzapu/WiFiManager.git
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.17.3
	thijse/ArduinoLog@^1.0.3
build_flags =
	-DMONITOR_RESET_PIN=GPIO_NUM_14
	-DMONITOR_BATTERY_PIN=GPIO_NUM_39
	-DMONITOR_I2C_SDA_PIN=21
	-DMONITOR_I2C_SCL_PIN=22
	-DMONITOR_BATTERY_ATTENUATION=ADC_ATTEN_DB_11
board_build.partitions = default_16MB.csv

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit BME280 Library @ ^2.1.2
	adafruit/Adafruit Unified Sensor @ ^1.1.4
	https://github.com/tzapu/WiFiManager.git
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.17.3
	thijse/ArduinoLog@^1.0.3
build_flags =
	-DMONITOR_RESET_PIN=GPIO_NUM_2
	-DMONITOR_BATTERY_PIN=GPIO_NUM_4
	-DMONITOR_I2C_SDA_PIN=8
	-DMONITOR_I2C_SCL_PIN=9
	-DMONITOR_BATTERY_ATTENUATION=ADC_ATTEN_DB_11

[env:native]
platform = native
test_build_src = no
test_transport = native
